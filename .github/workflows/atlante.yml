name: Atlante Meteo Trentino

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 6 * * *'
    - cron: '53 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && 'atlante-pages' || format('atlante-verifica-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --test tests/indicators.test.mjs

  prepara:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: verifica
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      gia_aggiornato: ${{ steps.freschezza.outputs.gia_aggiornato }}
    permissions:
      contents: read
    steps:
      - name: Controlla la data pubblicata
        id: freschezza
        if: github.event_name == 'schedule'
        run: |
          ieri=$(TZ=Etc/GMT-1 date -d yesterday +%F)
          echo "ieri=$ieri" >> "$GITHUB_OUTPUT"
          owner=${GITHUB_REPOSITORY_OWNER,,}
          url="https://$owner.github.io/${GITHUB_REPOSITORY#*/}/data/atlas.json.gz"
          if curl -fsSL --max-time 20 "$url?run=$GITHUB_RUN_ID" | gzip -dc |
              jq -e --arg ieri "$ieri" '.trigger == "programma" and (.latest | type == "string" and . >= $ieri)' > /dev/null; then
            echo "Dati del $ieri già pubblicati da un'esecuzione pianificata."
            echo "gia_aggiornato=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.freschezza.outputs.gia_aggiornato != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.freschezza.outputs.gia_aggiornato != 'true'
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
        if: steps.freschezza.outputs.gia_aggiornato != 'true'
      - name: Elabora i dati Meteotrentino
        if: steps.freschezza.outputs.gia_aggiornato != 'true'
        env:
          OPENBLAS_NUM_THREADS: '1'
          TRIGGER: ${{ github.event_name == 'schedule' && 'programma' || 'deploy' }}
        run: python refresh.py --trigger "$TRIGGER"
      - name: Verifica che i dati pianificati arrivino almeno a ieri
        if: github.event_name == 'schedule' && steps.freschezza.outputs.gia_aggiornato != 'true'
        env:
          IERI: ${{ steps.freschezza.outputs.ieri }}
        run: |
          set -o pipefail
          gzip -dc web/data/atlas.json.gz |
            jq -e --arg ieri "$IERI" '.latest | type == "string" and . >= $ieri'
      - uses: actions/upload-pages-artifact@v3
        if: steps.freschezza.outputs.gia_aggiornato != 'true'
        with:
          path: web

  pubblica:
    needs: prepara
    if: needs.prepara.outputs.gia_aggiornato != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pagine.outputs.page_url || steps.nuovo_tentativo.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: pagine
        continue-on-error: true
      # L’artefatto può non essere subito visibile al servizio di deploy.
      - if: steps.pagine.outcome == 'failure'
        run: sleep 15
      - if: steps.pagine.outcome == 'failure'
        uses: actions/deploy-pages@v4
        id: nuovo_tentativo
