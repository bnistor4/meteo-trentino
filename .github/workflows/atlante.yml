name: Atlante Meteo Trentino

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && 'atlante-pages' || format('atlante-verifica-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --test tests/indicators.test.mjs

  prepara:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: verifica
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Elabora i dati Meteotrentino
        env:
          OPENBLAS_NUM_THREADS: '1'
          TRIGGER: ${{ github.event_name == 'schedule' && 'programma' || 'deploy' }}
        run: python refresh.py --trigger "$TRIGGER"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  pubblica:
    needs: prepara
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pagine.outputs.page_url || steps.nuovo_tentativo.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: pagine
        continue-on-error: true
      # L’artefatto può non essere subito visibile al servizio di deploy.
      - if: steps.pagine.outcome == 'failure'
        run: sleep 15
      - if: steps.pagine.outcome == 'failure'
        uses: actions/deploy-pages@v4
        id: nuovo_tentativo
