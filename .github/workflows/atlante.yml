name: Atlante Meteo Trentino

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --test tests/indicators.test.mjs

  pubblica:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: verifica
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: atlante-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pagine.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/configure-pages@v5
      - run: python -m pip install -r requirements.txt
      - name: Elabora i dati Meteotrentino
        env:
          OPENBLAS_NUM_THREADS: '1'
          TRIGGER: ${{ github.event_name == 'schedule' && 'programma' || 'deploy' }}
        run: python refresh.py --trigger "$TRIGGER"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: pagine
